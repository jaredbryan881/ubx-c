name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build ${{ matrix.compiler }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DUBX_WARNINGS_AS_ERRORS=ON
          -DUBX_SANITIZE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  misra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cppcheck

      - name: MISRA C:2012 (cppcheck addon)
        run: tools/misra/run.sh

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang clang-tidy

      - name: Configure (compile_commands.json)
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DUBX_BUILD_TESTS=OFF

      - name: clang-tidy
        run: clang-tidy -p build src/*.c

  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting
        run: |
          test -f .clang-format || { echo "No .clang-format in repo; skipping enforcement."; exit 0; }
          clang-format --dry-run --Werror src/*.c src/*.h include/*.h tests/*.c

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DUBX_BUILD_TESTS=OFF
          -DUBX_BUILD_FUZZ=ON

      - name: Build fuzzer
        run: cmake --build build --target fuzz_parser

      - name: Run fuzzer for 60s
        run: ./build/fuzz/fuzz_parser -max_total_time=60
